name: Daily Build

on:
  # 只保留手动触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 Release 需要写权限

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive # 拉取子模块

      # 与 Android Studio 自带的 JetBrains Runtime 21 保持一致
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          # jetbrains 安装器通过 GitHub API 查询版本，带上 token 避免被限流
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # web 模块的 preBuild 会执行 `pnpm run build` 构建前端，必须准备好 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # gradle 的 buildWebUi 任务只跑 build 不跑 install，需在此提前安装依赖
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret 未配置"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/airhub-release.jks"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/airhub-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease

      - name: Rename APK
        id: apk
        shell: bash
        run: |
          timestamp="$(TZ=Asia/Shanghai date +%Y%m%d_%H%M)"
          short_sha="${GITHUB_SHA::7}"
          version="$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')"
          version="${version:-unknown}"
          apk_dir="app/build/outputs/apk/github/release"
          # 产物带渠道名（如 app-arm64-v8a-github-release.apk），按 ABI 关键字匹配
          apk_path="$(find "$apk_dir" -maxdepth 1 -type f -name '*arm64-v8a*release.apk' -print -quit)"
          if [ -z "$apk_path" ]; then
            apk_path="$(find "$apk_dir" -maxdepth 1 -type f -name '*universal*release.apk' -print -quit)"
          fi
          if [ -z "$apk_path" ]; then
            apk_path="$(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          fi
          if [ -z "$apk_path" ]; then
            echo "Release APK not found"
            exit 1
          fi

          renamed_path="$apk_dir/airhub_${version}_${timestamp}_${short_sha}.apk"
          mv "$apk_path" "$renamed_path"
          echo "path=$renamed_path" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: nightly
          name: AirHub Development Build
          prerelease: true
          body: |
            手动构建（commit `${{ github.sha }}`）

            > 开发版本，可能不稳定，仅供测试。
          files: ${{ steps.apk.outputs.path }}
